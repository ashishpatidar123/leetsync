<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; padding: 15px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; }
    h3 { margin-top: 0; color: #333; }
    label { font-size: 12px; font-weight: bold; color: #555; display: block; margin-top: 10px; }
    input { width: 90%; margin-top: 4px; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 96%; margin-top: 15px; padding: 10px; background-color: #2ea44f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #2c974b; }
    #status { margin-top: 10px; font-size: 12px; color: #d73a49; font-weight: bold; }
  </style>
</head>
<body>
  <h3>GitHub Settings</h3>
  <label>GitHub Username:</label>
  <input type="text" id="username" placeholder="e.g., octocat">
  <label>GitHub Repository Name:</label>
  <input type="text" id="repo" placeholder="e.g., coding-solutions">
  <label>Personal Access Token (PAT):</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxx">
  <p style="font-size: 11px; color: #666; margin-top: 15px;">Saving to: <b>/my-solutions/</b></p>
  <button id="saveBtn">Save Configuration</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
